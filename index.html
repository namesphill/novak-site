<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Novak Technologies</title>
  <meta name="description" content="Novak Technologies — specialists in the design and manufacture of industrial power supplies and rectifiers since 1993." />

  <!--
    Fallback redirect to the English home page. In production this should be
    served as a 301 by the cPanel .htaccess rule:
      RewriteEngine On
      RewriteRule ^$ /en/ [R=301,L]
    This meta-refresh + JS redirect is kept as a safety net.
  -->
  <meta http-equiv="refresh" content="0; url=/en/index.html" />
  <link rel="canonical" href="/en/index.html" />

  <link rel="alternate" hreflang="en" href="/en/index.html" />
  <link rel="alternate" hreflang="es" href="/es/index.html" />
  <link rel="alternate" hreflang="x-default" href="/en/index.html" />

  <script>
    // Immediate JS redirect (runs before the meta-refresh fires).
    window.location.replace('/en/index.html');
  </script>
</head>
<body>
  <noscript>
    <p>Redirecting to <a href="/en/index.html">Novak Technologies</a>…</p>
  </noscript>
</body>
</html>
